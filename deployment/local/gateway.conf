server {
    listen 8000;
    client_max_body_size 32m;
    location = /health { access_log off; return 204; }
    location /auth/v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://auth:9999/;
    }
    location /rest/v1/ {
        proxy_set_header Host $host;
        proxy_pass http://rest:3000/;
    }
    # This is the only function in the local runtime. Its own HMAC, timestamp
    # and nonce checks remain mandatory for every request.
    location = /functions/v1/sigap-backend {
        proxy_pass http://functions:9000;
    }
    location / { return 404; }
}
